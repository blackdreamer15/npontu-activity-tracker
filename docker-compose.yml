services:
  app:
    build: .
    ports:
      - "8000:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
    volumes:
      - ./:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "if (!@fsockopen('127.0.0.1', 8080)) { exit(1); }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
